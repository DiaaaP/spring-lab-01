name: Lab 9 PostgreSQL verification
on:
  push:
    branches: [codex/lab9]
    paths: ['src/**', 'pom.xml', '.github/workflows/lab9.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: docker info
      - run: bash mvnw -B clean verify
      - name: Check that PostgreSQL test ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('target/surefire-reports/TEST-kz.iitu.springlab.web.BookApiIntegrationTest.xml').getroot()
          assert int(suite.attrib['tests']) == 1
          assert all(int(suite.attrib[k]) == 0 for k in ('skipped','failures','errors'))
          PY
