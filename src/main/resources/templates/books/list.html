<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<p>Вы вошли как <strong sec:authentication="name"></strong> · <span sec:authentication="principal.authorities"></span></p>
<a sec:authorize="hasRole('ADMIN')" href="/admin">Администрирование</a>
<form th:action="@{/logout}" method="post"><button>Выйти</button></form>
<form sec:authorize="hasRole('ADMIN')" th:action="@{/books}" method="post">
    <label>Название <input name="title" required></label><label>Автор <input name="author" required></label>
    <label>Год <input type="number" name="year" required></label><button>Добавить книгу</button>
</form>
<h1 th:text="${title}">Catalogue</h1>

<p th:if="${message}" class="flash" th:text="${message}"></p>

<table>
    <tr>
        <th>#</th>
        <th>Title</th>
        <th>Author</th>
        <th>Year</th>
    </tr>

    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
    </tr>
</table>
</body>
</html>
