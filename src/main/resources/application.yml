spring:
  application:
    name: spring-lab
  datasource:
    url: jdbc:h2:mem:txlab;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  owner: Dias Mukhametsabyr
  group: IT1-2403IS
  mail:
    from: no-reply@iitu.kz
    retry-count: 5
    enabled: true
  ui:
    theme: LIGHT
    items-per-page: 20
logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
